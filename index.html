<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#D40511">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj4KICA8cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgZmlsbD0iI0Q0MDUxMSIvPgogIDx0ZXh0IHg9IjUwJSIgeT0iNTUlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjZmZmZmZmIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC13ZWlnaHQ9IjkwMCIgZm9udC1zaXplPSIyODAiPlNBPC90ZXh0Pgo8L3N2Zz4=">

  <title>Sorting Assistant</title>
  
  <style>
    /* --- CSS VARIABLES --- */
    :root {
      --bg-color: #f8f9fa;
      --text-color: #333333;
      --header-bg: #D40511;
      --card-bg: #ffffff;
      --card-shadow: 0 1px 2px rgba(0,0,0,0.08);
      --btn-bg: #ffffff;
      --btn-border: transparent;
      --btn-shadow: 0 2px 5px rgba(0,0,0,0.1);
      --stripe-bg: #fcfcfc;
      
      --tab-bg: #e0e0e0;
      --tab-text: #555555;
      
      --rm-red: #D40511;
      --rm-dark: #222222;
      --rm-yellow: #ffcc00;
    }

    body.dark-mode {
      --bg-color: #121212;
      --text-color: #f0f0f0;
      --header-bg: #1f1f1f;
      --card-bg: #1e1e1e;
      --card-shadow: none;
      --btn-bg: #2c2c2c;
      --btn-border: #333;
      --btn-shadow: 0 2px 5px rgba(0,0,0,0.3);
      --stripe-bg: #252525;
      
      --tab-bg: #333333;
      --tab-text: #cccccc;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      padding: 0; 
      margin: 0; 
      background-color: var(--bg-color); 
      color: var(--text-color);
      height: 100vh; 
      height: 100dvh; 
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #fixedControls {
      flex: 0 0 auto; 
      background-color: var(--bg-color);
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: background-color 0.3s;
      padding-bottom: 5px;
    }

    #scrollArea {
      flex: 1 1 auto; 
      overflow-y: auto; 
      -webkit-overflow-scrolling: touch; 
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #D40511, #b0040e);
      color: white;
      padding: 12px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    body.dark-mode header { background: #1a1a1a; border-bottom: 1px solid #333; }

    h1 { margin: 0; font-size: 1.05rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; flex-grow: 1; text-align: center; margin-left: 40px; }

    #themeToggle {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      font-size: 16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }

    .container { padding: 12px 10px 0 10px; max-width: 600px; margin: 0 auto; }

    /* POSTCODE AREA SELECTOR */
    .area-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      background: rgba(0,0,0,0.06);
      padding: 4px;
      border-radius: 30px;
    }
    body.dark-mode .area-selector { background: #222; }

    .area-btn {
      flex: 1;
      padding: 8px 0;
      font-size: 14px;
      font-weight: 800;
      border: none;
      border-radius: 24px;
      background: transparent;
      color: var(--tab-text);
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .area-btn.active {
      background: var(--rm-dark);
      color: #ffffff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    body.dark-mode .area-btn.active { background: #444444; color: #ffffff; }

    /* TABS */
    .tabs { display: flex; gap: 10px; margin-bottom: 10px; background: transparent; }
    
    .tab { 
      flex: 1; 
      padding: 11px;
      cursor: pointer; 
      background: var(--tab-bg); 
      border: none; 
      font-weight: 700; 
      font-size: 14px; 
      border-radius: 30px; 
      color: var(--tab-text);
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
      -webkit-tap-highlight-color: transparent;
    }
    
    .tab.active { 
      background: var(--rm-red); 
      color: white; 
      box-shadow: 0 4px 10px rgba(212, 5, 17, 0.3);
      transform: translateY(-1px);
    }

    /* GRIDS */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); 
      gap: 8px; 
      margin-bottom: 10px; 
      transition: all 0.2s ease; 
    }
    
    .grid button { 
      padding: 12px 0;
      font-size: 17px; 
      font-weight: 700; 
      cursor: pointer; 
      background: var(--btn-bg); 
      border: 1px solid var(--btn-border); 
      border-radius: 10px;
      color: var(--text-color); 
      box-shadow: var(--btn-shadow);
      touch-action: manipulation;
    }
    
    .grid button:active { transform: scale(0.95); }
    
    .grid button.selected { 
      background: var(--rm-red); 
      color: white; 
      border-color: var(--rm-red); 
      box-shadow: 0 4px 12px rgba(212, 5, 17, 0.4);
    }

    /* COMPACT GRID */
    .grid.compact {
      gap: 5px; 
      grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); 
    }
    .grid.compact button { padding: 7px 0; font-size: 13px; border-radius: 8px; }

    /* RESULTS LIST */
    .list-pad { padding: 0 10px; max-width: 600px; margin: 0 auto; }

    ul { list-style: none; padding: 0; margin-top: 5px; padding-bottom: 60px; }
    
    li { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      padding: 8px 12px;  
      margin-bottom: 3px;
      background: var(--card-bg); 
      border-radius: 6px; 
      box-shadow: var(--card-shadow); 
      font-size: 13px; 
      line-height: 1.2;
    }

    li:nth-child(even) { background-color: var(--stripe-bg); }
    
    li span.name { 
      font-weight: 600; 
      color: var(--text-color); 
      text-transform: uppercase;
    }
    
    li span.num { 
      font-weight: 900; 
      font-size: 1.2em; 
      color: var(--rm-red); 
      background: rgba(212, 5, 17, 0.1); 
      padding: 1px 6px;
      border-radius: 4px;
      min-width: 38px; 
      text-align: center;
    }

    .note-pill {
      background-color: var(--rm-yellow);
      color: #333;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 6px;
      font-weight: bold;
      vertical-align: middle;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      text-transform: uppercase;
    }

    .hidden { display: none !important; }
    #errorBox { background: #ffdddd; color: #a00; padding: 12px; margin: 10px; border-radius: 8px; text-align: center; display: none; }
  </style>
</head>
<body>

  <div id="fixedControls">
    <header>
      <h1>Sorting Assistant</h1>
      <button id="themeToggle" aria-label="Toggle Dark Mode">🌙</button>
    </header>

    <div class="container">
      <div id="errorBox"></div>

      <!-- ME10 / ME9 AREA SELECTOR -->
      <div class="area-selector">
        <button id="me10Btn" class="area-btn active">ME10</button>
        <button id="me9Btn" class="area-btn">ME9</button>
      </div>

      <!-- LOOKUP TABS -->
      <div class="tabs">
        <button id="roadTab" class="tab active">Road Lookup</button>
        <button id="dutyTab" class="tab">Duty Lookup</button>
      </div>

      <div id="letterGrid" class="grid"></div>
      <div id="dutyGrid" class="grid hidden"></div>
    </div>
  </div>

  <div id="scrollArea">
    <div class="list-pad">
      <ul id="results"></ul>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      const letterGrid = document.getElementById("letterGrid");
      const dutyGrid = document.getElementById("dutyGrid");
      const results = document.getElementById("results");
      const roadTab = document.getElementById("roadTab");
      const dutyTab = document.getElementById("dutyTab");
      const me10Btn = document.getElementById("me10Btn");
      const me9Btn = document.getElementById("me9Btn");
      const errorBox = document.getElementById("errorBox");
      const themeToggle = document.getElementById("themeToggle");
      const scrollArea = document.getElementById("scrollArea");

      let roadsData = [];
      let currentArea = "ME10";
      let currentMode = "road";

      // 100 is displayed as DPR
      const formatDutyLabel = (duty) => (duty === "100" ? "DPR" : duty);

      // Strip leading "THE " for letter determination and sorting
      const stripThe = (name) => name.replace(/^THE\s+/i, '').trim();

      // --- THEME ---
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-mode");
        themeToggle.textContent = "☀️";
      }

      themeToggle.onclick = () => {
        document.body.classList.toggle("dark-mode");
        const isDark = document.body.classList.contains("dark-mode");
        themeToggle.textContent = isDark ? "☀️" : "🌙";
        localStorage.setItem("theme", isDark ? "dark" : "light");
      };

      // --- CSV LOAD (WITH CACHE BUSTER) ---
      fetch("roads.csv?v=" + new Date().getTime())
        .then(res => {
          if (!res.ok) throw new Error("Could not find roads.csv");
          return res.text();
        })
        .then(text => {
          const lines = text.trim().split("\n").slice(1);

          let currentAreaTag = "ME10";

          lines.forEach(line => {
            if (!line || !line.includes(",")) return;

            const parts = line.split(",");
            const rawRoad = parts[0] ? parts[0].trim().replace(/"/g, '') : "";

            // If we hit the blank row gap, switch everything below to ME9
            if (!rawRoad) {
              currentAreaTag = "ME9";
              return;
            }

            // Calculate letter ignoring "THE "
            const cleanRoad = stripThe(rawRoad);
            const letter = cleanRoad.charAt(0).toUpperCase();

            // Duty in column 3 (parts[2])
            const rawDigits = parts[2] ? parts[2].replace(/[^\d]/g, '') : "";
            const dutyNum = rawDigits !== "" ? String(parseInt(rawDigits, 10)) : "?";

            // Notes in column 5 (parts[4])
            const notes = parts[4] ? parts[4].trim() : "";

            roadsData.push({
              road: rawRoad,
              duty: dutyNum,
              letter: letter,
              area: currentAreaTag,
              note: notes
            });
          });

          updateGrids();
          switchMode("road");
        })
        .catch(err => {
          errorBox.style.display = "block";
          errorBox.innerHTML = `Error: ${err.message}`;
        });

      // --- AREA SWITCHING ---
      me10Btn.onclick = () => {
        if (currentArea === "ME10") return;
        currentArea = "ME10";
        me10Btn.classList.add("active");
        me9Btn.classList.remove("active");
        results.innerHTML = "";
        updateGrids();
      };

      me9Btn.onclick = () => {
        if (currentArea === "ME9") return;
        currentArea = "ME9";
        me9Btn.classList.add("active");
        me10Btn.classList.remove("active");
        results.innerHTML = "";
        updateGrids();
      };

      // --- MODE SWITCHING ---
      function switchMode(mode) {
        currentMode = mode;
        results.innerHTML = "";
        letterGrid.classList.remove("compact");
        dutyGrid.classList.remove("compact");

        if (mode === "road") {
          roadTab.classList.add("active");
          dutyTab.classList.remove("active");
          letterGrid.classList.remove("hidden");
          dutyGrid.classList.add("hidden");
        } else {
          dutyTab.classList.add("active");
          roadTab.classList.remove("active");
          dutyGrid.classList.remove("hidden");
          letterGrid.classList.add("hidden");
        }
      }

      roadTab.onclick = () => switchMode("road");
      dutyTab.onclick = () => switchMode("duty");

      // --- UPDATE GRIDS ---
      function updateGrids() {
        letterGrid.classList.remove("compact");
        dutyGrid.classList.remove("compact");

        const filtered = roadsData.filter(r => r.area === currentArea);

        // 1. Letters for current area
        letterGrid.innerHTML = "";
        const letters = [...new Set(filtered.map(r => r.letter).filter(l => l >= "A" && l <= "Z"))].sort();

        letters.forEach(letter => {
          const btn = document.createElement("button");
          btn.textContent = letter;
          btn.onclick = (e) => {
            handleSelection(e.target, letterGrid);
            showRoads(filtered.filter(r => r.letter === letter), true);
          };
          letterGrid.appendChild(btn);
        });

        // 2. Duties for current area
        dutyGrid.innerHTML = "";
        const duties = [...new Set(filtered.map(r => r.duty))].sort((a, b) => {
          if (a === "100") return 1;
          if (b === "100") return -1;
          return parseInt(a, 10) - parseInt(b, 10);
        });

        duties.forEach(duty => {
          const btn = document.createElement("button");
          btn.textContent = formatDutyLabel(duty);
          btn.onclick = (e) => {
            handleSelection(e.target, dutyGrid);
            showRoads(filtered.filter(r => r.duty === duty), false);
          };
          dutyGrid.appendChild(btn);
        });
      }

      function handleSelection(btn, gridElement) {
        document.querySelectorAll(".grid button").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        gridElement.classList.add("compact");
        scrollArea.scrollTop = 0;
      }

      // --- RESULTS DISPLAY ---
      function showRoads(list, showNumbers) {
        results.innerHTML = "";
        list.sort((a, b) => stripThe(a.road).localeCompare(stripThe(b.road)));

        list.forEach(r => {
          const li = document.createElement("li");

          let html = `<span class="name">${r.road}`;
          if (r.note) html += `<span class="note-pill">${r.note}</span>`;
          html += `</span>`;

          if (showNumbers) {
            html += `<span class="num">${formatDutyLabel(r.duty)}</span>`;
          }

          li.innerHTML = html;
          results.appendChild(li);
        });
      }

    });
  </script>
</body>
</html>
