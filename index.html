<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#D40511">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj4KICA8cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgZmlsbD0iI0Q0MDUxMSIvPgogIDx0ZXh0IHg9IjUwJSIgeT0iNTUlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjZmZmZmZmIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC13ZWlnaHQ9IjkwMCIgZm9udC1zaXplPSIyODAiPlNBPC90ZXh0Pgo8L3N2Zz4=">
  <link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA1MTIgNTEyIj4KICA8cmVjdCB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgZmlsbD0iI0Q0MDUxMSIvPgogIDx0ZXh0IHg9IjUwJSIgeT0iNTUlIiBkb21pbmFudC1iYXNlbGluZT0ibWlkZGxlIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSIjZmZmZmZmIiBmb250LWZhbWlseT0ic2Fucy1zZXJpZiIgZm9udC13ZWlnaHQ9IjkwMCIgZm9udC1zaXplPSIyODAiPlNBPC90ZXh0Pgo8L3N2Zz4=">

  <title>Sorting Assistant</title>
  
  <style>
    /* --- CSS VARIABLES --- */
    :root {
      --bg-color: #f8f9fa;
      --text-color: #333333;
      --header-bg: #D40511;
      --card-bg: #ffffff;
      --card-shadow: 0 1px 2px rgba(0,0,0,0.08);
      --btn-bg: #ffffff;
      --btn-border: transparent;
      --btn-shadow: 0 2px 5px rgba(0,0,0,0.1);
      --stripe-bg: #fcfcfc;
      
      --tab-bg: #e0e0e0;
      --tab-text: #555555;
      
      --rm-red: #D40511;
      --rm-dark: #222222;
      --rm-yellow: #ffcc00;
      --rm-blue: #0066cc;
    }

    body.dark-mode {
      --bg-color: #121212;
      --text-color: #f0f0f0;
      --header-bg: #1f1f1f;
      --card-bg: #1e1e1e;
      --card-shadow: none;
      --btn-bg: #2c2c2c;
      --btn-border: #333;
      --btn-shadow: 0 2px 5px rgba(0,0,0,0.3);
      --stripe-bg: #252525;
      
      --tab-bg: #333333;
      --tab-text: #cccccc;
      --rm-blue: #4da3ff;
    }

    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      padding: 0; 
      margin: 0; 
      background-color: var(--bg-color); 
      color: var(--text-color);
      height: 100vh; 
      height: 100dvh; 
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #fixedControls {
      flex: 0 0 auto; 
      background-color: var(--bg-color);
      z-index: 10;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      transition: background-color 0.3s;
      padding-bottom: 5px;
    }

    #scrollArea {
      flex: 1 1 auto; 
      overflow-y: auto; 
      -webkit-overflow-scrolling: touch; 
    }

    /* HEADER */
    header {
      background: linear-gradient(135deg, #D40511, #b0040e);
      color: white;
      padding: 12px 10px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    body.dark-mode header { background: #1a1a1a; border-bottom: 1px solid #333; }

    h1 { 
      margin: 0; 
      font-size: 1.05rem; 
      font-weight: 800; 
      text-transform: uppercase; 
      letter-spacing: 1px; 
      flex-grow: 1; 
      text-align: center; 
      margin-left: 40px; 
    }

    #themeToggle {
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      font-size: 16px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
      -webkit-tap-highlight-color: transparent;
    }

    .container { padding: 12px 10px 0 10px; max-width: 600px; margin: 0 auto; }

    /* AREA SELECTOR (ME10 / ME9) */
    .area-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      background: rgba(0,0,0,0.08);
      padding: 4px;
      border-radius: 30px;
    }
    body.dark-mode .area-selector { background: #2a2a2a; }

    .area-btn {
      flex: 1;
      padding: 9px 0;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.5px;
      border: none;
      border-radius: 24px;
      background: transparent;
      color: var(--tab-text);
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .area-btn.active {
      background: #111111;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
    }
    body.dark-mode .area-btn.active { background: #eeeeee; color: #111111; }

    /* LOOKUP TABS */
    .tabs { display: flex; gap: 10px; margin-bottom: 10px; background: transparent; }
    
    .tab { 
      flex: 1; 
      padding: 11px;
      cursor: pointer; 
      background: var(--tab-bg); 
      border: none; 
      font-weight: 700; 
      font-size: 14px; 
      border-radius: 30px; 
      color: var(--tab-text);
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
      -webkit-tap-highlight-color: transparent;
    }
    
    .tab.active { 
      background: var(--rm-red); 
      color: white; 
      box-shadow: 0 4px 10px rgba(212, 5, 17, 0.3);
      transform: translateY(-1px);
    }

    /* GRIDS */
    .grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); 
      gap: 8px; 
      margin-bottom: 10px; 
      transition: all 0.2s ease; 
    }
    
    .grid button { 
      padding: 12px 0;
      font-size: 17px; 
      font-weight: 700; 
      cursor: pointer; 
      background: var(--btn-bg); 
      border: 1px solid var(--btn-border); 
      border-radius: 10px;
      color: var(--text-color); 
      box-shadow: var(--btn-shadow);
      touch-action: manipulation;
    }
    
    .grid button:active { transform: scale(0.95); }
    
    .grid button.selected { 
      background: var(--rm-red); 
      color: white; 
      border-color: var(--rm-red); 
      box-shadow: 0 4px 12px rgba(212, 5, 17, 0.4);
    }

    .grid.compact {
      gap: 5px; 
      grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); 
    }
    .grid.compact button { padding: 7px 0; font-size: 13px; border-radius: 8px; }

    /* RESULTS LIST */
    .list-pad { padding: 0 10px; max-width: 600px; margin: 0 auto; }

    /* WALKTHROUGH LINK ROW */
    .walkthrough-link-row {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      margin-bottom: 3px;
      background: var(--card-bg);
      border-radius: 6px;
      box-shadow: var(--card-shadow);
      font-size: 13px;
      line-height: 1.2;
      cursor: pointer;
      color: var(--rm-red);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      -webkit-tap-highlight-color: transparent;
    }
    .walkthrough-link-row:active {
      opacity: 0.7;
    }

    ul { list-style: none; padding: 0; margin-top: 5px; padding-bottom: 60px; }
    
    li { 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      padding: 8px 12px;  
      margin-bottom: 3px;
      background: var(--card-bg); 
      border-radius: 6px; 
      box-shadow: var(--card-shadow); 
      font-size: 13px; 
      line-height: 1.2;
    }

    li:nth-child(even) { background-color: var(--stripe-bg); }
    
    li span.name { 
      font-weight: 600; 
      color: var(--text-color); 
      text-transform: uppercase;
    }
    
    li span.num { 
      font-weight: 900; 
      font-size: 1.2em; 
      color: var(--rm-red); 
      background: rgba(212, 5, 17, 0.1); 
      padding: 1px 6px;
      border-radius: 4px;
      min-width: 38px; 
      text-align: center;
    }

    .note-pill {
      background-color: var(--rm-yellow);
      color: #333;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 6px;
      font-weight: bold;
      vertical-align: middle;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
      text-transform: uppercase;
    }

    /* --- WALKTHROUGH FULL-SCREEN VIEW --- */
    #walkthroughModal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--bg-color);
      z-index: 100;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateY(100%);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    #walkthroughModal.open {
      transform: translateY(0);
    }

    .walk-header {
      background: linear-gradient(135deg, #D40511, #b0040e);
      color: white;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex: 0 0 auto;
    }
    body.dark-mode .walk-header { background: #1a1a1a; border-bottom: 1px solid #333; }

    .walk-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .walk-btn {
      background: rgba(0,0,0,0.25);
      border: none;
      color: white;
      font-size: 13.5px;
      padding: 6px 12px;
      border-radius: 18px;
      cursor: pointer;
      font-weight: 700;
      -webkit-tap-highlight-color: transparent;
    }
    .walk-btn:active {
      background: rgba(0,0,0,0.45);
    }

    .walk-controls {
      background-color: var(--bg-color);
      padding: 10px 10px 6px 10px;
      flex: 0 0 auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .walk-scroll {
      flex: 1 1 auto;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 10px 10px 80px 10px;
      max-width: 600px;
      margin: 0 auto;
      width: calc(100% - 20px);
      box-sizing: border-box;
    }

    /* LOOP ACCORDION CARDS */
    .loop-card {
      background: var(--card-bg);
      border-radius: 10px;
      margin-bottom: 10px;
      box-shadow: var(--card-shadow);
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.04);
      transition: opacity 0.2s;
    }

    .loop-card.completed {
      opacity: 0.55;
    }

    .loop-card-header {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .loop-check {
      width: 22px;
      height: 22px;
      accent-color: var(--rm-red);
      cursor: pointer;
    }

    .loop-meta {
      flex: 1;
    }

    .loop-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .loop-card.completed .loop-title {
      text-decoration: line-through;
    }

    .loop-park {
      font-size: 11.5px;
      color: #777;
      margin-top: 2px;
      font-weight: 600;
    }
    body.dark-mode .loop-park { color: #aaa; }

    .loop-arrow {
      font-size: 14px;
      color: #999;
      transition: transform 0.2s ease;
      font-weight: bold;
    }

    .loop-card.expanded .loop-arrow {
      transform: rotate(90deg);
    }

    /* LOOP STEPS */
    .loop-steps {
      display: none;
      padding: 0 14px 10px 14px;
      border-top: 1px solid rgba(0,0,0,0.06);
    }
    body.dark-mode .loop-steps { border-top-color: #333; }

    .loop-card.expanded .loop-steps {
      display: block;
    }

    .step-item {
      display: flex;
      align-items: baseline;
      padding: 7px 0;
      border-bottom: 1px solid rgba(0,0,0,0.04);
      font-size: 13.5px;
      line-height: 1.3;
    }
    body.dark-mode .step-item { border-bottom-color: #2a2a2a; }

    .step-item:last-child { border-bottom: none; }

    .step-detail {
      flex: 1;
      font-weight: 600;
      color: var(--text-color);
    }

    /* BLUE TEXT FOR COLLECTIONS */
    .step-detail.collection-step {
      color: var(--rm-blue);
      font-weight: 700;
    }

    .step-note {
      background-color: var(--rm-yellow);
      color: #333;
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 6px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .sat-badge {
      background: #eef2ff;
      color: #4338ca;
      font-size: 9.5px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 6px;
      margin-left: 6px;
      text-transform: uppercase;
    }
    body.dark-mode .sat-badge { background: #312e81; color: #c7d2fe; }

    .hidden { display: none !important; }
    #errorBox { background: #ffdddd; color: #a00; padding: 12px; margin: 10px; border-radius: 8px; text-align: center; display: none; }
  </style>
</head>
<body>

  <div id="fixedControls">
    <header>
      <h1>Sorting Assistant</h1>
      <button id="themeToggle" aria-label="Toggle Dark Mode">🌙</button>
    </header>

    <div class="container">
      <div id="errorBox"></div>

      <!-- AREA SELECTOR -->
      <div class="area-selector">
        <button id="me10Btn" class="area-btn active">ME10</button>
        <button id="me9Btn" class="area-btn">ME9</button>
      </div>

      <!-- LOOKUP TABS -->
      <div class="tabs">
        <button id="roadTab" class="tab active">Road Lookup</button>
        <button id="dutyTab" class="tab">Duty Lookup</button>
      </div>

      <div id="letterGrid" class="grid"></div>
      <div id="dutyGrid" class="grid hidden"></div>
    </div>
  </div>

  <div id="scrollArea">
    <div class="list-pad">
      <!-- Walkthrough red text link row -->
      <div id="walkthroughLinkRow" class="walkthrough-link-row hidden">
        <span>Walkthrough</span>
      </div>

      <ul id="results"></ul>
    </div>
  </div>

  <!-- WALKTHROUGH FULL-SCREEN VIEW -->
  <div id="walkthroughModal">
    <div class="walk-header">
      <div style="font-weight: 800; font-size: 1.05rem; letter-spacing: 0.5px;">WALKTHROUGH GUIDE</div>
      <div class="walk-actions">
        <button id="resetChecksBtn" class="walk-btn">Reset</button>
        <button id="closeWalkthroughBtn" class="walk-btn">Close</button>
      </div>
    </div>

    <div class="walk-controls">
      <div class="container" style="padding-top: 0;">
        <div class="tabs" style="margin-bottom: 4px;">
          <button id="walkWeekdayBtn" class="tab active">Weekday (Mon–Fri)</button>
          <button id="walkSaturdayBtn" class="tab">Saturday</button>
        </div>
      </div>
    </div>

    <div class="walk-scroll">
      <div id="loopsContainer"></div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      
      const letterGrid = document.getElementById("letterGrid");
      const dutyGrid = document.getElementById("dutyGrid");
      const results = document.getElementById("results");
      const roadTab = document.getElementById("roadTab");
      const dutyTab = document.getElementById("dutyTab");
      const me10Btn = document.getElementById("me10Btn");
      const me9Btn = document.getElementById("me9Btn");
      const errorBox = document.getElementById("errorBox");
      const themeToggle = document.getElementById("themeToggle");
      const scrollArea = document.getElementById("scrollArea");

      // Walkthrough elements
      const walkthroughLinkRow = document.getElementById("walkthroughLinkRow");
      const resetChecksBtn = document.getElementById("resetChecksBtn");
      const closeWalkthroughBtn = document.getElementById("closeWalkthroughBtn");
      const walkthroughModal = document.getElementById("walkthroughModal");
      const walkWeekdayBtn = document.getElementById("walkWeekdayBtn");
      const walkSaturdayBtn = document.getElementById("walkSaturdayBtn");
      const loopsContainer = document.getElementById("loopsContainer");

      let roadsData = [];
      let currentArea = "ME10";
      let currentMode = "road";
      let walkDayMode = "weekday";

      const formatDutyLabel = (duty) => (duty === "100" ? "DPR" : duty);
      const stripThe = (name) => name.replace(/^THE\s+/i, '').trim();

      // Theme toggle
      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-mode");
        themeToggle.textContent = "☀️";
      }

      themeToggle.onclick = () => {
        document.body.classList.toggle("dark-mode");
        const isDark = document.body.classList.contains("dark-mode");
        themeToggle.textContent = isDark ? "☀️" : "🌙";
        localStorage.setItem("theme", isDark ? "dark" : "light");
      };

      // Load CSV
      fetch("roads.csv?v=" + new Date().getTime())
        .then(res => {
          if (!res.ok) throw new Error("Could not find roads.csv");
          return res.text();
        })
        .then(text => {
          const lines = text.trim().split("\n").slice(1);
          let reachedME9 = false;

          lines.forEach(line => {
            if (!line || !line.includes(",")) return;

            const parts = line.split(",");
            const rawRoad = parts[0] ? parts[0].trim().replace(/"/g, '') : "";

            if (!rawRoad || parts[1].trim() === "") {
              reachedME9 = true;
            }

            if (!rawRoad) return;

            const cleanRoad = stripThe(rawRoad);
            const letter = cleanRoad.charAt(0).toUpperCase();
            const rawDigits = parts[2] ? parts[2].replace(/[^\d]/g, '') : "";
            const dutyNum = rawDigits !== "" ? String(parseInt(rawDigits, 10)) : "?";
            const notes = parts[4] ? parts[4].trim() : "";

            roadsData.push({
              road: rawRoad,
              duty: dutyNum,
              letter: letter,
              area: reachedME9 ? "ME9" : "ME10",
              note: notes
            });

            if (rawRoad === "YPRES DRIVE") {
              reachedME9 = true;
            }
          });

          updateGrids();
          switchMode("road");
        })
        .catch(err => {
          errorBox.style.display = "block";
          errorBox.innerHTML = `Error: ${err.message}`;
        });

      // Area Buttons
      me10Btn.onclick = () => {
        if (currentArea === "ME10") return;
        currentArea = "ME10";
        me10Btn.classList.add("active");
        me9Btn.classList.remove("active");
        results.innerHTML = "";
        walkthroughLinkRow.classList.add("hidden");
        updateGrids();
      };

      me9Btn.onclick = () => {
        if (currentArea === "ME9") return;
        currentArea = "ME9";
        me9Btn.classList.add("active");
        me10Btn.classList.remove("active");
        results.innerHTML = "";
        walkthroughLinkRow.classList.add("hidden");
        updateGrids();
      };

      // Modes
      function switchMode(mode) {
        currentMode = mode;
        results.innerHTML = "";
        walkthroughLinkRow.classList.add("hidden");
        letterGrid.classList.remove("compact");
        dutyGrid.classList.remove("compact");

        if (mode === "road") {
          roadTab.classList.add("active");
          dutyTab.classList.remove("active");
          letterGrid.classList.remove("hidden");
          dutyGrid.classList.add("hidden");
        } else {
          dutyTab.classList.add("active");
          roadTab.classList.remove("active");
          dutyGrid.classList.remove("hidden");
          letterGrid.classList.add("hidden");
        }
      }

      roadTab.onclick = () => switchMode("road");
      dutyTab.onclick = () => switchMode("duty");

      function updateGrids() {
        letterGrid.classList.remove("compact");
        dutyGrid.classList.remove("compact");

        const filtered = roadsData.filter(r => r.area === currentArea);

        // Letter Grid
        letterGrid.innerHTML = "";
        const letters = [...new Set(filtered.map(r => r.letter).filter(l => l >= "A" && l <= "Z"))].sort();

        letters.forEach(letter => {
          const btn = document.createElement("button");
          btn.textContent = letter;
          btn.onclick = (e) => {
            handleSelection(e.target, letterGrid);
            walkthroughLinkRow.classList.add("hidden");
            showRoads(filtered.filter(r => r.letter === letter), true);
          };
          letterGrid.appendChild(btn);
        });

        // Duty Grid
        dutyGrid.innerHTML = "";
        const duties = [...new Set(filtered.map(r => r.duty))].sort((a, b) => {
          if (a === "100") return 1;
          if (b === "100") return -1;
          return parseInt(a, 10) - parseInt(b, 10);
        });

        duties.forEach(duty => {
          const btn = document.createElement("button");
          btn.textContent = formatDutyLabel(duty);
          btn.onclick = (e) => {
            handleSelection(e.target, dutyGrid);

            // Show Walkthrough link in red text if Duty 1 or Duty 2 is selected
            if (currentArea === "ME10" && (duty === "1" || duty === "2")) {
              walkthroughLinkRow.classList.remove("hidden");
            } else {
              walkthroughLinkRow.classList.add("hidden");
            }

            showRoads(filtered.filter(r => r.duty === duty), false);
          };
          dutyGrid.appendChild(btn);
        });
      }

      function handleSelection(btn, gridElement) {
        document.querySelectorAll(".grid button").forEach(b => b.classList.remove("selected"));
        btn.classList.add("selected");
        gridElement.classList.add("compact");
        scrollArea.scrollTop = 0;
      }

      function showRoads(list, showNumbers) {
        results.innerHTML = "";
        list.sort((a, b) => stripThe(a.road).localeCompare(stripThe(b.road)));

        list.forEach(r => {
          const li = document.createElement("li");

          let html = `<span class="name">${r.road}`;
          if (r.note) html += `<span class="note-pill">${r.note}</span>`;
          html += `</span>`;

          if (showNumbers) {
            html += `<span class="num">${formatDutyLabel(r.duty)}</span>`;
          }

          li.innerHTML = html;
          results.appendChild(li);
        });

      // --- RENDER WALKTHROUGH ---
      function renderWalkthrough() {
        loopsContainer.innerHTML = "";
        const isSat = (walkDayMode === "saturday");
        const savedChecked = JSON.parse(localStorage.getItem("completedLoops") || "{}");

        WALKTHROUGH_DATA.forEach(loopData => {
          const validSteps = loopData.steps.filter(s => {
            if (isSat) {
              return s.days !== "Monday - Friday";
            } else {
              return s.days !== "Saturday";
            }
          });

          if (validSteps.length === 0) return;

          const card = document.createElement("div");
          card.className = "loop-card";
          card.id = `loopCard-${loopData.loop}`;

          const isCompleted = !!savedChecked[loopData.loop];
          if (isCompleted) card.classList.add("completed");

          // Header
          const header = document.createElement("div");
          header.className = "loop-card-header";

          const chk = document.createElement("input");
          chk.type = "checkbox";
          chk.className = "loop-check";
          chk.checked = isCompleted;
          chk.onclick = (e) => {
            e.stopPropagation();
            const checked = chk.checked;
            card.classList.toggle("completed", checked);
            savedChecked[loopData.loop] = checked;
            localStorage.setItem("completedLoops", JSON.stringify(savedChecked));
          };

          const meta = document.createElement("div");
          meta.className = "loop-meta";

          const titleText = loopData.loop === 13 ? "Collections" : `Loop ${loopData.loop}: ${loopData.name}`;
          const parkHtml = loopData.park ? `<div class="loop-park">Park: ${loopData.park}</div>` : "";

          meta.innerHTML = `
            <div class="loop-title">
              <span>${titleText}</span>
              <span class="loop-arrow">❯</span>
            </div>
            ${parkHtml}
          `;

          header.appendChild(chk);
          header.appendChild(meta);

          // Steps list (No step numbers, no stop counts)
          const stepsBox = document.createElement("div");
          stepsBox.className = "loop-steps";

          validSteps.forEach(s => {
            const stepRow = document.createElement("div");
            stepRow.className = "step-item";

            const collectionClass = s.isCollection ? " collection-step" : "";
            let noteHtml = s.notes ? `<span class="step-note">${s.notes}</span>` : "";
            let satHtml = (isSat && s.days === "Saturday") ? `<span class="sat-badge">Sat Only</span>` : "";

            stepRow.innerHTML = `
              <span class="step-detail${collectionClass}">${s.address} ${noteHtml} ${satHtml}</span>
            `;
            stepsBox.appendChild(stepRow);
          });

          header.addEventListener("click", () => {
            card.classList.toggle("expanded");
          });

          card.appendChild(header);
          card.appendChild(stepsBox);
          loopsContainer.appendChild(card);
        });
      }

      // Reset button: clears all checked loops
      resetChecksBtn.onclick = () => {
        localStorage.removeItem("completedLoops");
        renderWalkthrough();
      };

      // Day mode toggles
      walkWeekdayBtn.onclick = () => {
        if (walkDayMode === "weekday") return;
        walkDayMode = "weekday";
        walkWeekdayBtn.classList.add("active");
        walkSaturdayBtn.classList.remove("active");
        renderWalkthrough();
      };

      walkSaturdayBtn.onclick = () => {
        if (walkDayMode === "saturday") return;
        walkDayMode = "saturday";
        walkSaturdayBtn.classList.add("active");
        walkWeekdayBtn.classList.remove("active");
        renderWalkthrough();
      };

      // Open walkthrough when clicking the red text link
      walkthroughLinkRow.onclick = () => {
        renderWalkthrough();
        walkthroughModal.classList.add("open");
      };

      closeWalkthroughBtn.onclick = () => {
        walkthroughModal.classList.remove("open");
      };
